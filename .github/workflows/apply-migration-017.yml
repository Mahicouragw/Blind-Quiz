name: Apply Migration 017 (guarded)

# Applies ONLY supabase/migrations/202610060017_feedback_inbox.sql (the bq_feedback and bq_admins
# tables for Settings > Send feedback and the Goldfish feedback inbox) through the Supabase
# Management API query endpoint. Requested by the owner on 6 Oct 2026.
#
# Migrations 001-016 are already applied remotely and are never recreated, rerun, or pushed.
# The Supabase CLI migration commands are deliberately NOT used, because the remote migration
# history does not match this repository and the CLI would try to replay 001-009.
#
# Additive and idempotent (create if not exists, on conflict do nothing). If the Goldfish account
# does not exist yet, the run warns; re-run it after signing up to add the admin row.
#
# Secret: SUPABASE_ACCESS_TOKEN (passed only as an environment variable, never printed).

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'supabase/migrations/202610060017_feedback_inbox.sql'
      - 'scripts/apply-migration-017.mjs'
      - '.github/workflows/apply-migration-017.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-migration-017
  cancel-in-progress: false

env:
  PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'zchircgdkyjnowqcdwvf' }}
  MIGRATION_FILE: supabase/migrations/202610060017_feedback_inbox.sql

jobs:
  apply:
    name: Apply Migration 017 only and verify row counts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard - this workflow never replays migrations 001-016
        run: |
          set -euo pipefail
          SELF=.github/workflows/apply-migration-017.yml
          EXEC=$(grep -vE '^[[:space:]]*#' "$SELF")
          # Character classes keep these patterns from matching this guard itself.
          if printf '%s\n' "$EXEC" | grep -nE 'supabase[[:space:]]+(d[b]|migratio[n]|lin[k])|p[s]ql|--d[b]-ur[l]|see[d]\.sq[l]|setup-cl[i]'; then
            echo "::error::Only the Management API query endpoint may be used. Supabase CLI database tooling, direct Postgres clients, and seed files are not allowed."
            exit 1
          fi
          if [ "$MIGRATION_FILE" != "supabase/migrations/202610060017_feedback_inbox.sql" ]; then
            echo "::error::This workflow applies Migration 017 only."
            exit 1
          fi
          echo "Confirmed: no CLI migration tooling; target is Migration 017 only."

      - name: Guard - validate content and Migration 017 statically
        run: |
          npm test
          node --no-warnings scripts/apply-migration-017.mjs --check

      - name: Apply Migration 017 and verify row counts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node --no-warnings scripts/apply-migration-017.mjs --apply
