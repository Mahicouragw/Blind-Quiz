name: Apply Migration 020 (guarded)

# Uses the shared guard in scripts/lib/guarded-migration.mjs.
# Applies ONLY supabase/migrations/202610060020_private_messages.sql (end-to-end encrypted
# private messages: two new tables holding only public keys and ciphertext, five functions) through the Supabase Management API query endpoint.
# Requested by the owner (Task 19) on 6 Oct 2026.
#
# Migrations 001-019 are already applied remotely and are never recreated, rerun, or pushed.
# The Supabase CLI migration commands are deliberately NOT used, because the remote migration
# history does not match this repository and the CLI would try to replay 001-009.
#
# Additive and idempotent (create if not exists, create or replace).
#
# Secret: SUPABASE_ACCESS_TOKEN (passed only as an environment variable, never printed).

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'supabase/migrations/202610060020_private_messages.sql'
      - 'scripts/apply-migration-020.mjs'
      - 'scripts/lib/guarded-migration.mjs'
      - 'tests/db-migrations.mjs'
      - '.github/workflows/apply-migration-020.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-migration-020
  cancel-in-progress: false

env:
  PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'zchircgdkyjnowqcdwvf' }}
  MIGRATION_FILE: supabase/migrations/202610060020_private_messages.sql

jobs:
  apply:
    name: Apply Migration 020 only and verify row counts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard - this workflow never replays migrations 001-019
        run: |
          set -euo pipefail
          SELF=.github/workflows/apply-migration-020.yml
          EXEC=$(grep -vE '^[[:space:]]*#' "$SELF")
          # Character classes keep these patterns from matching this guard itself.
          if printf '%s\n' "$EXEC" | grep -nE 'supabase[[:space:]]+(d[b]|migratio[n]|lin[k])|p[s]ql|--d[b]-ur[l]|see[d]\.sq[l]|setup-cl[i]'; then
            echo "::error::Only the Management API query endpoint may be used. Supabase CLI database tooling, direct Postgres clients, and seed files are not allowed."
            exit 1
          fi
          if [ "$MIGRATION_FILE" != "supabase/migrations/202610060020_private_messages.sql" ]; then
            echo "::error::This workflow applies Migration 020 only."
            exit 1
          fi
          echo "Confirmed: no CLI migration tooling; target is Migration 020 only."

      - name: Guard - validate content and Migration 020 statically
        run: |
          npm test
          node --no-warnings scripts/apply-migration-020.mjs --check

      - name: Dry run all migrations in an in-memory Postgres (PGlite) with behavioural checks
        run: |
          npm i --no-save --no-package-lock @electric-sql/pglite@0.2
          node tests/db-migrations.mjs

      - name: Apply Migration 020 and verify row counts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node --no-warnings scripts/apply-migration-020.mjs --apply
