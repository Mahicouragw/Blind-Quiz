name: Apply Migration 021 (guarded)

# Uses the shared guard in scripts/lib/guarded-migration.mjs.
# Applies ONLY supabase/migrations/202610060021_rooms.sql (rooms, room chat,
# live room games, spectators and comments: six new tables, three default public rooms, thirteen functions) through the Supabase Management API query endpoint.
# Requested by the owner (Task 19) on 6 Oct 2026.
#
# Migrations 001-020 are already applied remotely and are never recreated, rerun, or pushed.
# The Supabase CLI migration commands are deliberately NOT used, because the remote migration
# history does not match this repository and the CLI would try to replay 001-009.
#
# Additive and idempotent (create if not exists, create or replace).
#
# Secret: SUPABASE_ACCESS_TOKEN (passed only as an environment variable, never printed).

# Migration 021 is applied. It must never run again: a re-run re-creates its functions and can replace
# newer versions from later migrations. Manual run only, for disaster recovery by the owner.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-migration-021
  cancel-in-progress: false

env:
  PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'zchircgdkyjnowqcdwvf' }}
  MIGRATION_FILE: supabase/migrations/202610060021_rooms.sql

jobs:
  apply:
    name: Apply Migration 021 only and verify row counts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard - this workflow never replays migrations 001-020
        run: |
          set -euo pipefail
          SELF=.github/workflows/apply-migration-021.yml
          EXEC=$(grep -vE '^[[:space:]]*#' "$SELF")
          # Character classes keep these patterns from matching this guard itself.
          if printf '%s\n' "$EXEC" | grep -nE 'supabase[[:space:]]+(d[b]|migratio[n]|lin[k])|p[s]ql|--d[b]-ur[l]|see[d]\.sq[l]|setup-cl[i]'; then
            echo "::error::Only the Management API query endpoint may be used. Supabase CLI database tooling, direct Postgres clients, and seed files are not allowed."
            exit 1
          fi
          if [ "$MIGRATION_FILE" != "supabase/migrations/202610060021_rooms.sql" ]; then
            echo "::error::This workflow applies Migration 021 only."
            exit 1
          fi
          echo "Confirmed: no CLI migration tooling; target is Migration 021 only."

      - name: Guard - validate content and Migration 021 statically
        run: |
          npm test
          node --no-warnings scripts/apply-migration-021.mjs --check

      - name: Dry run all migrations in an in-memory Postgres (PGlite) with behavioural checks
        run: |
          npm i --no-save --no-package-lock @electric-sql/pglite@0.2
          node tests/db-migrations.mjs

      - name: Apply Migration 021 and verify row counts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node --no-warnings scripts/apply-migration-021.mjs --apply
