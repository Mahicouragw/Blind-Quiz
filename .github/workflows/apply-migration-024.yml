name: Apply Migration 024 (guarded)

# Uses the shared guard in scripts/lib/guarded-migration.mjs.
# Applies ONLY supabase/migrations/202610070024_app_notifications.sql (background notifications for the
# Android app: a per-phone key that can only read the player's own new notifications) through the Supabase Management API query endpoint.
# Requested by the owner (Task 19 stage F / Task 20 APK) on 7 Oct 2026.
#
# Migrations 001-023 are already applied remotely and are never recreated, rerun, or pushed.
# The Supabase CLI migration commands are deliberately NOT used, because the remote migration
# history does not match this repository and the CLI would try to replay 001-009.
#
# Additive and idempotent (create if not exists, create or replace).
#
# Secret: SUPABASE_ACCESS_TOKEN (passed only as an environment variable, never printed).

# Runs only when Migration 024's own files change, never on shared test or library changes, so older
# migrations are not re-run alongside it.
# Migration 024 is applied. It must never run again (a re-run can replace newer functions from later
# migrations). Manual run only, for disaster recovery by the owner.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply-migration-024
  cancel-in-progress: false

env:
  PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'zchircgdkyjnowqcdwvf' }}
  MIGRATION_FILE: supabase/migrations/202610070024_app_notifications.sql

jobs:
  apply:
    name: Apply Migration 024 only and verify row counts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard - this workflow never replays migrations 001-023
        run: |
          set -euo pipefail
          SELF=.github/workflows/apply-migration-024.yml
          EXEC=$(grep -vE '^[[:space:]]*#' "$SELF")
          # Character classes keep these patterns from matching this guard itself.
          if printf '%s\n' "$EXEC" | grep -nE 'supabase[[:space:]]+(d[b]|migratio[n]|lin[k])|p[s]ql|--d[b]-ur[l]|see[d]\.sq[l]|setup-cl[i]'; then
            echo "::error::Only the Management API query endpoint may be used. Supabase CLI database tooling, direct Postgres clients, and seed files are not allowed."
            exit 1
          fi
          if [ "$MIGRATION_FILE" != "supabase/migrations/202610070024_app_notifications.sql" ]; then
            echo "::error::This workflow applies Migration 024 only."
            exit 1
          fi
          echo "Confirmed: no CLI migration tooling; target is Migration 024 only."

      - name: Guard - validate content and Migration 024 statically
        run: |
          npm test
          node --no-warnings scripts/apply-migration-024.mjs --check

      - name: Dry run all migrations in an in-memory Postgres (PGlite) with behavioural checks
        run: |
          npm i --no-save --no-package-lock @electric-sql/pglite@0.2
          node tests/db-migrations.mjs

      - name: Apply Migration 024 and verify row counts
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node --no-warnings scripts/apply-migration-024.mjs --apply
