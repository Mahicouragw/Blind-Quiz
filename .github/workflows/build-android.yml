name: Build Android APK

# Builds the Flutter WebView wrapper in android-app/ into a signed release APK and
# publishes it as a workflow artifact and a GitHub Release. The app loads the live site,
# so content updates never require reinstalling.
#
# Signing: uses ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS /
# ANDROID_KEY_PASSWORD when present (stable identity, in-place updates). Otherwise a
# temporary key is generated for the run; it is never uploaded or printed.

on:
  push:
    branches: [main, 'arena/**']
    paths:
      - 'android-app/**'
      - '.github/workflows/build-android.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: build-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, sign, and publish release APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: android-app
    env:
      VERSION_NAME: 1.0.${{ github.run_number }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate the Android project
        run: |
          set -euo pipefail
          flutter --version
          # Creates only missing files; lib/, test/, and pubspec.yaml are kept as committed.
          flutter create --platforms android --org io.github.mahicouragw --project-name blind_quiz .
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Release builds need INTERNET in the main manifest (flutter create puts it only in debug).
          grep -q 'android.permission.INTERNET' "$MANIFEST" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$MANIFEST"
          sed -i 's#android:label="[^"]*"#android:label="Blind Quiz"#' "$MANIFEST"
          # HTTPS only, and no cloud/device backups of WebView storage (remembered name/Login ID, session).
          grep -q 'usesCleartextTraffic' "$MANIFEST" || \
            sed -i 's#<application#<application android:usesCleartextTraffic="false" android:allowBackup="false" android:fullBackupContent="false"#' "$MANIFEST"
          # Android 11+ package visibility: let the Contact us link open the user's email app.
          grep -q 'android.intent.action.SENDTO' "$MANIFEST" || \
            sed -i 's#<application#<queries><intent><action android:name="android.intent.action.SENDTO"/><data android:scheme="mailto"/></intent></queries>\n    <application#' "$MANIFEST"
          # Calls between friends and room voice messages: microphone, camera (video calls only) and call audio routing.
          # Asked at runtime only when the player starts or answers a call or records. No storage permissions:
          # files are picked with the system picker and received files are handed to the share sheet.
          grep -q 'xmlns:tools' "$MANIFEST" || sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' "$MANIFEST"
          grep -q 'android.permission.RECORD_AUDIO' "$MANIFEST" || \
            sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO"/>\n    <uses-permission android:name="android.permission.CAMERA"/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-feature android:name="android.hardware.camera" android:required="false"/>\n    <uses-feature android:name="android.hardware.microphone" android:required="false"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" tools:node="remove"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" tools:node="remove"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" tools:node="remove"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" tools:node="remove"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" tools:node="remove"/>\n    <application#' "$MANIFEST"
          grep -n 'INTERNET\|RECORD_AUDIO\|CAMERA\|MODIFY_AUDIO\|tools:node\|android:label\|usesCleartextTraffic\|allowBackup\|SENDTO' "$MANIFEST"
          # Native microphone/camera and notification helpers, plus WorkManager's app configuration.
          ACT_DIR=android/app/src/main/kotlin/io/github/mahicouragw/blind_quiz
          mkdir -p "$ACT_DIR" && cp native/MainActivity.kt native/NotifyWorker.kt native/BlindQuizApplication.kt "$ACT_DIR/"
          # R8 can remove constructors WorkManager loads reflectively from release builds.
          # Flutter's Gradle plugin automatically adds this app-level file to release R8 rules.
          cp native/proguard-rules.pro android/app/proguard-rules.pro
          grep -n -- '-keep class \* extends androidx\.' android/app/proguard-rules.pro
          APP_CLASS='io.github.mahicouragw.blind_quiz.BlindQuizApplication'
          if grep -Fq 'android:name="${applicationName}"' "$MANIFEST"; then
            sed -i 's#android:name="${applicationName}"#android:name="io.github.mahicouragw.blind_quiz.BlindQuizApplication"#' "$MANIFEST"
          elif ! grep -Fq "android:name=\"$APP_CLASS\"" "$MANIFEST"; then
            echo "::error::Generated manifest does not declare the expected application placeholder; refusing to build without BlindQuizApplication."
            exit 1
          fi
          grep -n 'android:name=' "$MANIFEST"
          # We initialize WorkManager in BlindQuizApplication. Remove only its AndroidX Startup
          # metadata (not the provider), so Lint and runtime agree on on-demand initialization.
          python3 - "$MANIFEST" <<'PY'
          from pathlib import Path
          import sys

          manifest = Path(sys.argv[1])
          text = manifest.read_text()
          metadata = 'android:name="androidx.work.WorkManagerInitializer"'
          if metadata not in text:
              closing = '</application>'
              snippet = '''
                  <provider
                      android:name="androidx.startup.InitializationProvider"
                      android:authorities="${applicationId}.androidx-startup"
                      android:exported="false"
                      tools:node="merge">
                      <meta-data android:name="androidx.work.WorkManagerInitializer" tools:node="remove" />
                  </provider>
              '''
              if text.count(closing) != 1:
                  raise SystemExit('Expected exactly one </application> in generated manifest')
              manifest.write_text(text.replace(closing, snippet + '\n' + closing, 1))
          PY
          grep -n 'WorkManagerInitializer\|android:name=' "$MANIFEST"
          find android/app/src/main -name 'MainActivity.*' ! -path "$ACT_DIR/MainActivity.kt" -delete
          find android/app/src/main -name 'MainActivity.*'
          # Background notifications (android-app/native/NotifyWorker.kt): WorkManager and AndroidX notifications.
          GRADLE=android/app/build.gradle.kts
          if [ -f "$GRADLE" ]; then
            grep -q 'androidx.work:work-runtime' "$GRADLE" || printf '\ndependencies {\n    implementation("androidx.work:work-runtime:2.9.1")\n    implementation("androidx.core:core:1.13.1")\n}\n' >> "$GRADLE"
          else
            GRADLE=android/app/build.gradle
            grep -q 'androidx.work:work-runtime' "$GRADLE" || printf "\ndependencies {\n    implementation 'androidx.work:work-runtime:2.9.1'\n    implementation 'androidx.core:core:1.13.1'\n}\n" >> "$GRADLE"
          fi
          tail -5 "$GRADLE"; grep -n 'minSdk' "$GRADLE" || true
          # Blind Quiz launcher icon (braille "?" cell with sound waves) instead of the Flutter default.
          for d in icons/mipmap-*; do cp "$d/ic_launcher.png" "android/app/src/main/res/$(basename "$d")/ic_launcher.png"; done
          ls -la android/app/src/main/res/mipmap-*/ic_launcher.png

      - name: Get packages
        run: flutter pub get 2>&1 | tee "$RUNNER_TEMP/pub.log" || { sed 's/^/::error title=pub get::/' "$RUNNER_TEMP/pub.log" | tail -20; exit 1; }

      # Log archives are not always downloadable, so problems are re-emitted as annotations.
      - name: Analyze
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > "$RUNNER_TEMP/analyze.log" 2>&1
          status=$?
          cat "$RUNNER_TEMP/analyze.log"
          grep -E '^\s*(error|warning) •' "$RUNNER_TEMP/analyze.log" | head -20 | sed 's/^\s*/::warning title=flutter analyze::/'
          if [ $status -ne 0 ]; then grep -E '•' "$RUNNER_TEMP/analyze.log" | head -20 | sed 's/^\s*/::error title=flutter analyze::/'; fi
          exit $status

      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee "$RUNNER_TEMP/test.log" || { grep -iE 'error|fail|expected' "$RUNNER_TEMP/test.log" | head -20 | sed 's/^/::error title=flutter test::/'; exit 1; }

      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release --build-name "$VERSION_NAME" --build-number "$VERSION_CODE" 2>&1 | tee "$RUNNER_TEMP/build.log" || { grep -iE 'error|failed|what went wrong|exception' "$RUNNER_TEMP/build.log" | head -25 | sed 's/^/::error title=flutter build::/'; exit 1; }

      - name: Sign release APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KS="$RUNNER_TEMP/release.jks"
          if [ -n "${KEYSTORE_B64:-}" ] && [ -n "${KEYSTORE_PASSWORD:-}" ] && [ -n "${KEY_ALIAS:-}" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > "$KS"
            KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"
            echo "SIGNING_MODE=repository keystore" >> "$GITHUB_ENV"
          else
            echo "::warning title=Temporary signing key::ANDROID_KEYSTORE_* secrets are not set, so this APK is signed with a key generated for this run. It installs normally, but later builds cannot update it in place. See android-app/README.md."
            KEYSTORE_PASSWORD=$(openssl rand -hex 24); KEY_PASSWORD="$KEYSTORE_PASSWORD"; KEY_ALIAS=blindquiz
            keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias "$KEY_ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" -dname "CN=Blind Quiz, O=Blind Quiz, C=IN" >/dev/null
            echo "SIGNING_MODE=temporary key (set ANDROID_KEYSTORE_* secrets for a stable key)" >> "$GITHUB_ENV"
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          IN=build/app/outputs/flutter-apk/app-release.apk
          OUT="$GITHUB_WORKSPACE/blind-quiz-$VERSION_NAME.apk"
          "$BT/zipalign" -f -p 4 "$IN" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" sign --ks "$KS" --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --out "$OUT" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --verbose --print-certs "$OUT" | grep -E 'Verified|Signer #1 certificate (DN|SHA-256)'
          rm -f "$KS"
          echo "APK_PATH=$OUT" >> "$GITHUB_ENV"
          ls -l "$OUT"

      - name: Audit the signed APK (permissions, debuggable, cleartext, backup)
        run: |
          set -euo pipefail
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          PERMS=$("$BT/aapt2" dump permissions "$APK_PATH" | grep -oE "name='[^']+'" | sed "s/name='//;s/'//" | sort -u)
          echo "Permissions:"; echo "$PERMS"
          EXTRA=$(echo "$PERMS" | grep -vE '^(android\.permission\.(INTERNET|RECORD_AUDIO|CAMERA|MODIFY_AUDIO_SETTINGS|POST_NOTIFICATIONS|WAKE_LOCK|RECEIVE_BOOT_COMPLETED|FOREGROUND_SERVICE|ACCESS_NETWORK_STATE)|io\.github\.mahicouragw\.blind_quiz\.DYNAMIC_RECEIVER_NOT_EXPORTED_PERMISSION)$' || true)
          if [ -n "$EXTRA" ]; then echo "::error title=APK permissions::Unexpected permissions: $(echo $EXTRA)"; exit 1; fi
          MAN=$("$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK_PATH")
          if echo "$MAN" | grep -qE 'debuggable\([^)]*\)=(true|\(type 0x12\)0xffffffff)'; then echo "::error title=APK::APK is debuggable"; exit 1; fi
          echo "$MAN" | grep -qE 'usesCleartextTraffic\([^)]*\)=(false|\(type 0x12\)0x0)' || { echo "::error title=APK::usesCleartextTraffic=false missing"; exit 1; }
          echo "$MAN" | grep -qE 'allowBackup\([^)]*\)=(false|\(type 0x12\)0x0)' || { echo "::error title=APK::allowBackup=false missing"; exit 1; }
          SDKS=$("$BT/aapt2" dump badging "$APK_PATH" | grep -oiE "(minSdkVersion|sdkVersion|targetSdkVersion):'[0-9]+'" | sort -u | tr '\n' ' ')
          echo "SDK_INFO=$SDKS" >> "$GITHUB_ENV"
          echo "::notice title=APK audit::$SDKS Permissions: $(echo $PERMS). Not debuggable; cleartext traffic disabled; backups disabled; release-signed."

      - name: Enable KVM for the Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Install, launch, and reboot-test the signed APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash "$GITHUB_WORKSPACE/android-app/scripts/emulator-smoke.sh" "$APK_PATH" "$RUNNER_TEMP/android-emulator-logs"

      - name: Upload emulator crash logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blind-quiz-${{ env.VERSION_NAME }}-emulator-logs
          path: ${{ runner.temp }}/android-emulator-logs/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: blind-quiz-${{ env.VERSION_NAME }}-apk
          path: ${{ env.APK_PATH }}
          if-no-files-found: error

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-v$VERSION_NAME"
          # Every build is the latest release and also carries a fixed-name copy, so these links never change:
          #   https://github.com/<repo>/releases/latest/download/blind-quiz.apk
          #   https://mahicouragw.github.io/Blind-Quiz/download/blind-quiz.apk (mirrored by the Pages deploy)
          cp "$APK_PATH" "$RUNNER_TEMP/blind-quiz.apk"
          NOTES="Blind Quiz for Android $VERSION_NAME, built from ${GITHUB_SHA::7} on $GITHUB_REF_NAME.

          The app opens the live site (https://mahicouragw.github.io/Blind-Quiz/) over HTTPS only, with an accessible Reload button that keeps a valid sign-in session. Other links open in your browser. Permissions: internet; notifications (friend requests, messages, feedback replies, game invites, announcements and game updates, each with its own sound you can change in Android settings; checked about every 15 minutes, no Firebase); microphone and camera, asked only when you start or answer a call between friends or record a room voice message. Works on Android phones and tablets ($SDK_INFO). No storage or contacts access: files you send are picked with the Android file picker, and files friends send are offered to save or open.
          Signing: $SIGNING_MODE.
          Install: download the APK on your Android phone and allow installing from this source when prompted."
          gh release create "$TAG" "$APK_PATH" "$RUNNER_TEMP/blind-quiz.apk" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Blind Quiz for Android $VERSION_NAME" --notes "$NOTES" --latest
          # Publish the new APK on the website download link too.
          gh workflow run deploy-pages.yml --ref "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" || echo "::warning::Could not trigger the Pages deploy"
          {
            echo "## Android APK"
            echo "- Release: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG"
            echo "- Download: https://mahicouragw.github.io/Blind-Quiz/download/blind-quiz.apk"
            echo "- Signing: $SIGNING_MODE"
          } >> "$GITHUB_STEP_SUMMARY"
