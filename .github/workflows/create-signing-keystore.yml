name: Create Android signing keystore

# One-time owner helper for a stable signing key, so new APKs install over old ones.
# It generates release.jks with random passwords and packs the keystore, its base64 text
# and the four secret values into a password-protected zip artifact. Nothing secret is
# printed to the workflow log.
#
# After this run: download the artifact, unzip it with the password you chose, copy the
# four lines from secret-values.txt into Settings -> Secrets and variables -> Actions,
# then DELETE the artifact and re-run "Build Android APK".

on:
  workflow_dispatch:
    inputs:
      zip_password:
        description: Password for the downloaded zip (choose your own, at least 16 characters)
        required: true

permissions:
  contents: read

concurrency:
  group: create-signing-keystore
  cancel-in-progress: false

jobs:
  create:
    name: Generate keystore and the copy-paste secret values
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate the keystore and the secret values
        env:
          ZIP_PASSWORD: ${{ github.event.inputs.zip_password }}
        run: |
          set -euo pipefail
          if [ ${#ZIP_PASSWORD} -lt 16 ]; then echo "::error::Choose a zip password of at least 16 characters."; exit 1; fi
          KS=android-release.jks
          STORE_PASS=$(openssl rand -hex 24)
          ALIAS=blindquiz
          keytool -genkeypair -keystore "$KS" -storetype PKCS12 -alias "$ALIAS" -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PASS" -keypass "$STORE_PASS" -dname "CN=Blind Quiz, O=Blind Quiz, C=IN" >/dev/null
          base64 -w0 "$KS" > keystore-base64.txt
          {
            echo "ANDROID_KEYSTORE_BASE64=$(cat keystore-base64.txt)"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASS"
            echo "ANDROID_KEY_ALIAS=$ALIAS"
            echo "ANDROID_KEY_PASSWORD=$STORE_PASS"
          } > secret-values.txt
          # Safe to show: only the alias and the certificate fingerprint (not a secret).
          keytool -list -keystore "$KS" -storepass "$STORE_PASS" | grep -E 'Alias name:|SHA256:' || true
          zip -P "$ZIP_PASSWORD" blind-quiz-signing.zip "$KS" keystore-base64.txt secret-values.txt
          rm -f "$KS" keystore-base64.txt secret-values.txt
          ls -l blind-quiz-signing.zip

      - name: Upload the protected zip (delete the artifact after copying the values)
        uses: actions/upload-artifact@v4
        with:
          name: blind-quiz-signing-${{ github.run_number }}
          path: blind-quiz-signing.zip
          retention-days: 1
          if-no-files-found: error
