name: Deploy blind-quiz-api Edge Function

# Replaces the deployed blind-quiz-api Edge Function with exactly the source in
# supabase/functions/blind-quiz-api/ — one complete upload per run.
#
# `supabase functions deploy` bundles the whole function directory and swaps the
# deployed version wholesale. It never appends to, patches, or concatenates with
# whatever is already deployed, which is what produced the production failure:
#   Uncaught SyntaxError: Identifier 'createClient' has already been declared
#   at index.ts:680:10
#
# This workflow NEVER touches the database. Migrations 001-009 are already
# applied remotely and are deliberately not recreated, rerun, or pushed.
#
# Secrets: requires the SUPABASE_ACCESS_TOKEN repository secret (a Supabase
# personal access token). It is only ever passed to the Supabase CLI as an
# environment variable and is never echoed. Only the public publishable key —
# which already ships to browsers — is used by the verification job.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'scripts/check-function-source.mjs'
      - 'tests/live-api.mjs'
      - '.github/workflows/deploy-function.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'scripts/check-function-source.mjs'
      - 'tests/live-api.mjs'
      - '.github/workflows/deploy-function.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-blind-quiz-api
  cancel-in-progress: false

env:
  PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'zchircgdkyjnowqcdwvf' }}
  FUNCTION_NAME: blind-quiz-api

jobs:
  deploy:
    name: Deploy Edge Function (complete replacement)
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard - this workflow must not run migrations
        run: |
          set -euo pipefail
          SELF=.github/workflows/deploy-function.yml
          EXEC=$(grep -vE '^[[:space:]]*#' "$SELF")

          # 1. Every Supabase CLI invocation must be `functions deploy`.
          mapfile -t CALLS < <(printf '%s\n' "$EXEC" | grep -oE '^[[:space:]]*supabase .*' | sed 's/^[[:space:]]*//' || true)
          if [ "${#CALLS[@]}" -eq 0 ]; then
            echo "::error::No Supabase CLI invocation found; the deploy step is missing."
            exit 1
          fi
          for call in "${CALLS[@]}"; do
            case "$call" in
              "supabase functions deploy "*) ;;
              *) echo "::error::Only 'supabase functions deploy' is permitted in this workflow. Found: $call"; exit 1 ;;
            esac
          done

          # 2. No schema, migration, or seed tooling may appear on an executable
          #    line. Patterns use character classes so they cannot match
          #    themselves inside this guard.
          if printf '%s\n' "$EXEC" | grep -nE 'supabase (d[b]|migratio[n]|secret[s]|lin[k]|star[t]|sto[p]|inspec[t]|ge[n])|p[s]ql|--d[b]-ur[l]|see[d]\.sq[l]'; then
            echo "::error::Migrations 001-009 are already applied remotely. This workflow must not recreate, rerun, push, or seed them."
            exit 1
          fi
          echo "Confirmed: ${#CALLS[@]} Supabase CLI call(s), all 'functions deploy'. No migration, schema, seed, or database operation."

      - name: Guard - Edge Function source integrity
        run: node --no-warnings scripts/check-function-source.mjs

      - name: Report source being deployed
        run: |
          echo "Function directory contents:"
          find supabase/functions/"$FUNCTION_NAME" -type f -print
          echo "Deploying $(wc -l < supabase/functions/"$FUNCTION_NAME"/index.ts) lines as one complete bundle."

      - name: Check for Supabase deploy credential
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Missing SUPABASE_ACCESS_TOKEN secret::The Edge Function cannot be deployed from CI until a Supabase personal access token is stored as the SUPABASE_ACCESS_TOKEN repository secret (GitHub > Settings > Secrets and variables > Actions). The token value is never printed here."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "SUPABASE_ACCESS_TOKEN secret is present (value not shown)."
          fi

      - name: Set up Supabase CLI
        if: steps.token.outputs.present == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy blind-quiz-api (replaces the deployed version)
        id: deploy
        if: steps.token.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions deploy "$FUNCTION_NAME" \
            --project-ref "$PROJECT_REF" \
            --use-api \
            --no-verify-jwt
          echo "deployed=true" >> "$GITHUB_OUTPUT"

      - name: Fail when deployment could not run
        if: steps.token.outputs.present != 'true'
        run: exit 1

  verify:
    name: Verify the deployed function
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ !cancelled() }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run live API verification
        env:
          BQ_VERIFY_ORIGIN: https://mahicouragw.github.io
        run: node --no-warnings tests/live-api.mjs
