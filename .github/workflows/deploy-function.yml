name: Deploy blind-quiz-api Edge Function

# Replaces the deployed blind-quiz-api Edge Function with exactly the source in
# supabase/functions/blind-quiz-api/ — one complete upload per run.
#
# `supabase functions deploy` bundles the whole function directory and swaps the
# deployed version wholesale. It never appends to, patches, or concatenates with
# whatever is already deployed, which is what produced the production failure:
#   Uncaught SyntaxError: Identifier 'createClient' has already been declared
#   at index.ts:680:10
#
# This workflow NEVER touches the database. Migrations 001-009 are already
# applied remotely and are deliberately not recreated, rerun, or pushed.
#
# Secrets: requires the SUPABASE_ACCESS_TOKEN repository secret (a Supabase
# personal access token). It is only ever passed to the Supabase CLI as an
# environment variable and is never echoed. Only the public publishable key —
# which already ships to browsers — is used by the verification job.

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'scripts/check-function-source.mjs'
      - 'tests/live-api.mjs'
      - '.github/workflows/deploy-function.yml'
  pull_request:
    paths:
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - 'scripts/check-function-source.mjs'
      - 'tests/live-api.mjs'
      - '.github/workflows/deploy-function.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: deploy-blind-quiz-api
  cancel-in-progress: false

env:
  PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'zchircgdkyjnowqcdwvf' }}
  FUNCTION_NAME: blind-quiz-api

jobs:
  deploy:
    name: Deploy Edge Function (complete replacement)
    runs-on: ubuntu-latest
    outputs:
      deployed: ${{ steps.deploy.outputs.deployed }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Guard - this workflow must not run migrations
        run: |
          set -euo pipefail
          SELF=.github/workflows/deploy-function.yml
          EXEC=$(grep -vE '^[[:space:]]*#' "$SELF")

          # 1. Every Supabase CLI invocation must be `functions deploy`.
          mapfile -t CALLS < <(printf '%s\n' "$EXEC" | grep -oE '^[[:space:]]*supabase .*' | sed 's/^[[:space:]]*//' || true)
          if [ "${#CALLS[@]}" -eq 0 ]; then
            echo "::error::No Supabase CLI invocation found; the deploy step is missing."
            exit 1
          fi
          for call in "${CALLS[@]}"; do
            case "$call" in
              "supabase functions deploy "*) ;;
              *) echo "::error::Only 'supabase functions deploy' is permitted in this workflow. Found: $call"; exit 1 ;;
            esac
          done

          # 2. No schema, migration, or seed tooling may appear on an executable
          #    line. Patterns use character classes so they cannot match
          #    themselves inside this guard.
          if printf '%s\n' "$EXEC" | grep -nE 'supabase (d[b]|migratio[n]|secret[s]|lin[k]|star[t]|sto[p]|inspec[t]|ge[n])|p[s]ql|--d[b]-ur[l]|see[d]\.sq[l]'; then
            echo "::error::Migrations 001-009 are already applied remotely. This workflow must not recreate, rerun, push, or seed them."
            exit 1
          fi
          echo "Confirmed: ${#CALLS[@]} Supabase CLI call(s), all 'functions deploy'. No migration, schema, seed, or database operation."

      - name: Guard - Edge Function source integrity
        run: node --no-warnings scripts/check-function-source.mjs

      - name: Report source being deployed
        run: |
          echo "Function directory contents:"
          find supabase/functions/"$FUNCTION_NAME" -type f -print
          echo "Deploying $(wc -l < supabase/functions/"$FUNCTION_NAME"/index.ts) lines as one complete bundle."

      - name: Check for Supabase deploy credential
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SB_ACCESS_TOKEN || secrets.SUPABASE_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::error title=Missing Supabase deploy credential::No Supabase access token is stored in this repository. Add one under Settings > Secrets and variables > Actions as SUPABASE_ACCESS_TOKEN (SB_ACCESS_TOKEN and SUPABASE_TOKEN are also accepted). Create it at https://supabase.com/dashboard/account/tokens. The token value is never printed here."
            {
              echo "## Edge Function deployment — BLOCKED"
              echo ""
              echo "The source passed every integrity guard and is ready to deploy, but this repository has **no Supabase access token secret**."
              echo ""
              echo "Add it at **Settings → Secrets and variables → Actions → New repository secret**:"
              echo ""
              echo "- Name: \`SUPABASE_ACCESS_TOKEN\` (\`SB_ACCESS_TOKEN\` or \`SUPABASE_TOKEN\` also work)"
              echo "- Value: a personal access token from https://supabase.com/dashboard/account/tokens"
              echo ""
              echo "Then re-run this workflow. Nothing is ever printed or stored in the log."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "Supabase access token secret is present (value not shown)."
          fi

      - name: Set up Supabase CLI
        if: steps.token.outputs.present == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy blind-quiz-api (replaces the deployed version)
        id: deploy
        if: steps.token.outputs.present == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN || secrets.SB_ACCESS_TOKEN || secrets.SUPABASE_TOKEN }}
        run: |
          # One retry for transient upload errors; on failure the CLI output tail becomes an annotation
          # (no secrets are printed by the CLI; the token is only in the environment).
          set +e
          for attempt in 1 2; do
            supabase functions deploy "$FUNCTION_NAME" --project-ref "$PROJECT_REF" --use-api --no-verify-jwt > deploy.log 2>&1
            rc=$?
            cat deploy.log
            [ "$rc" -eq 0 ] && break
            echo "::warning title=Deploy attempt $attempt failed::$(tail -c 700 deploy.log | tr '\n' ' ')"
            sleep 20
          done
          set -e
          if [ "$rc" -ne 0 ]; then echo "::error title=Edge Function deploy failed::$(tail -c 900 deploy.log | tr '\n' ' ')"; exit 1; fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          {
            echo "## Edge Function deployment — COMPLETE REPLACEMENT"
            echo ""
            echo "- Function: \`$FUNCTION_NAME\`"
            echo "- Project ref: \`$PROJECT_REF\`"
            echo "- Source: \`supabase/functions/$FUNCTION_NAME/index.ts\` ($(wc -l < supabase/functions/"$FUNCTION_NAME"/index.ts) lines)"
            echo "- Mode: whole-directory bundle upload; the previous deployed version was discarded, not appended to"
            echo "- Migrations: none run (001–009 left untouched)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when deployment could not run
        if: steps.token.outputs.present != 'true'
        run: exit 1

  verify:
    name: Verify the deployed function
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ !cancelled() }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run live API verification
        env:
          BQ_VERIFY_ORIGIN: https://mahicouragw.github.io
          BQ_EXPECT_AI_NAME: 'true'
          BQ_REPORT_FILE: ${{ runner.temp }}/live-api-summary.md
        run: |
          set -o pipefail
          node --no-warnings tests/live-api.mjs 2>&1 | tee "$RUNNER_TEMP/live-api.log"

      # Runner log archives are not always retrievable, so post the outcome back
      # to the pull request. Contains only status codes and check names.
      - name: Report the outcome on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          SUMMARY="${{ runner.temp }}/live-api-summary.md"
          {
            echo "### blind-quiz-api deployment attempt"
            echo
            echo "- Workflow run: [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- Commit: \`${GITHUB_SHA::7}\`"
            if [ "${{ needs.deploy.outputs.deployed }}" = "true" ]; then
              echo "- Deployment: **complete replacement succeeded**"
            else
              echo "- Deployment: **did not run** - see the deploy job annotation"
            fi
            echo
            if [ -s "$SUMMARY" ]; then cat "$SUMMARY"; else echo "_Live verification produced no summary; see the job annotation._"; fi
          } > "${{ runner.temp }}/comment.md"
          gh pr comment "${{ github.event.pull_request.number }}" \
            --repo "${{ github.repository }}" \
            --body-file "${{ runner.temp }}/comment.md"
