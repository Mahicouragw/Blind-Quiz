name: Deploy Blind Quiz to GitHub Pages

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run validation tests
        run: npm test
      - name: Run behavioural UI tests (jsdom)
        run: |
          npm i --no-save --no-package-lock jsdom@24
          node --no-warnings tests/ui-session.mjs
      - name: Build static site
        run: npm run build
      - name: Add the latest Android APK to the site (download link)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist/download
          if gh release download -R "$GITHUB_REPOSITORY" --pattern blind-quiz.apk -D dist/download 2>/dev/null; then
            ls -la dist/download; echo "::notice title=APK::Published at /download/blind-quiz.apk"
          else
            echo "::warning title=APK::No release with blind-quiz.apk yet"
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
