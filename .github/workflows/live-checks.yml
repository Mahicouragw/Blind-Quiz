name: Live checks (read-only)

# Runs `npm run test:live` against the production blind-quiz-api and checks that
# Migration 010 questions award XP and coins. Never deploys the function and never
# touches migrations; uses only the public publishable key.

on:
  push:
    branches: [main, 'arena/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-checks
  cancel-in-progress: false

jobs:
  live:
    name: npm run test:live and Migration 010 rewards
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm run test:live
        env:
          BQ_VERIFY_ORIGIN: https://mahicouragw.github.io
        run: |
          set -o pipefail
          npm run test:live 2>&1 | tee "$RUNNER_TEMP/live.log"
          # Surface the verdict as an annotation (log archives are not always downloadable).
          echo "::notice title=npm run test:live::$(grep -E '^(PASS|FAIL): [0-9]+/[0-9]+' "$RUNNER_TEMP/live.log" | tail -1)"
      - name: Migration 010 questions award XP and coins
        if: ${{ !cancelled() }}
        run: node --no-warnings scripts/check-migration-010-live.mjs
