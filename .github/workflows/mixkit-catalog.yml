name: Mixkit sound catalog (read-only listing)

# Lists Mixkit sound effects (id and title) for choosing Sound Match sounds and commits
# scripts/audio/mixkit-catalog.json. Downloads no audio.
on:
  push:
    branches: ['arena/**']
    paths:
      - 'scripts/audio/mixkit-catalog.mjs'
      - '.github/workflows/mixkit-catalog.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --no-warnings scripts/audio/mixkit-catalog.mjs
      - name: Commit catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/audio/mixkit-catalog.json
          if git diff --cached --quiet; then echo "No change."; exit 0; fi
          git commit -m "Audio: Mixkit sound catalog for Sound Match (ids and titles only)"
          git pull --rebase -q origin ${{ github.ref_name }}
          git push origin HEAD:${{ github.ref_name }}
