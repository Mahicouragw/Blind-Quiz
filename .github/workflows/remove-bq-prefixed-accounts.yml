name: Remove BQ-prefixed account records (guarded)

# Manual, narrowly scoped cleanup requested by the owner. Preview and deletion are separate labels.
# Deletion requires exactly 677 matching display names, matching normalized names, the existing
# service_role-only transactional deletion function, and at least one admin outside the target set.
# The workflow never prints account names, IDs, login IDs, or secrets.
# Secret: SUPABASE_ACCESS_TOKEN (environment-only; never printed).
on:
  push:
    branches: ['arena/**']
    paths:
      - '.github/workflows/remove-bq-prefixed-accounts.yml'
      - 'scripts/remove-bq-prefixed-accounts.mjs'
      - 'supabase/migrations/202610110029_account_deletion.sql'
  pull_request:
    types: [labeled]
    paths:
      - '.github/workflows/remove-bq-prefixed-accounts.yml'
      - 'scripts/remove-bq-prefixed-accounts.mjs'
      - 'supabase/migrations/202610110029_account_deletion.sql'

permissions:
  contents: read

concurrency:
  group: remove-bq-prefixed-accounts
  cancel-in-progress: false

env:
  PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF || 'zchircgdkyjnowqcdwvf' }}

jobs:
  preview:
    name: Read-only prefix and safety preflight
    if: ${{ github.event_name == 'push' || github.event.label.name == 'preview-bq-prefix-removal' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Preview aggregate counts only (no account data)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node --no-warnings scripts/remove-bq-prefixed-accounts.mjs --preview

  apply:
    name: Remove exactly 677 BQ-prefixed accounts
    if: ${{ github.event.label.name == 'remove-bq-prefixed-accounts' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Guard - require the owner-requested exact-count confirmation
        env:
          BQ_DELETE_CONFIRMATION: DELETE-677-BQ-ACCOUNTS
        run: |
          set -euo pipefail
          test "$BQ_DELETE_CONFIRMATION" = 'DELETE-677-BQ-ACCOUNTS'
          echo 'Confirmed: exact prefix and expected count are enforced by the deletion script.'
      - name: Delete transactionally through the existing account-erasure function
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          BQ_DELETE_CONFIRMATION: DELETE-677-BQ-ACCOUNTS
        run: node --no-warnings scripts/remove-bq-prefixed-accounts.mjs --apply
