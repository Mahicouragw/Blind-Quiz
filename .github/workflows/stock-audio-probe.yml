name: Stock audio discovery (read-only)

# Lists candidate Mixkit sound effects and Pixabay music tracks (titles and direct URLs) as annotations.
# Downloads and commits nothing.
on:
  push:
    branches: ['arena/**']
    paths:
      - 'scripts/audio/stock-probe.mjs'
      - 'scripts/audio/stock-probe-pages.txt'
      - '.github/workflows/stock-audio-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: List candidates
        run: node --no-warnings scripts/audio/stock-probe.mjs $(grep -v '^#' scripts/audio/stock-probe-pages.txt)
